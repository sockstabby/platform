# Build the app image and (optionally) push it to GHCR.
# Called from app repos as: sockstabby/platform/.github/workflows/reusable-build.yml@v1
name: reusable-build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name under ghcr.io/<owner>/ (usually the repo name)"
        type: string
        required: true
      image-tag:
        description: "Tag to apply (git SHA for debug builds)"
        type: string
        default: ${{ github.sha }}
      push:
        description: "Push to GHCR. false = build-only validation (e.g. on PRs)"
        type: boolean
        default: false
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Target platforms. EKS nodes are t3 (amd64)"
        type: string
        default: "linux/amd64"
    outputs:
      image:
        description: "Full image reference (repository:tag)"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest (empty when push=false)"
        value: ${{ jobs.build.outputs.digest }}

# Permissions are deliberately NOT declared here: a called workflow can only keep or reduce what
# the caller grants, so declaring packages: write would force every caller (including PR CI) to
# grant it. Callers grant exactly what they need:
#   push: false  ->  contents: read
#   push: true   ->  contents: read, packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}
          TAG: ${{ inputs.image-tag }}
        run: |
          repo="ghcr.io/${OWNER,,}/${NAME,,}"   # GHCR requires lowercase
          echo "repository=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.ref.outputs.image }}
          build-args: APP_VERSION=${{ inputs.image-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          PUSHED: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}\` (pushed: ${PUSHED})" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$DIGEST" ] && echo "- digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY" || true
