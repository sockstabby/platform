# Deploy an already-built image to an environment's EKS cluster with Helm.
# Called from app repos as: sockstabby/platform/.github/workflows/reusable-deploy.yml@v1
#
# Per-environment settings live in the caller repo's GitHub Environment (variables, not secrets;
# neither value is sensitive and there are no static AWS keys anywhere):
#   AWS_ROLE_ARN      deploy role created by the platform github-oidc component
#   EKS_CLUSTER_NAME  cluster created by the platform eks component
name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment (debug | production). Must be set on the job so the OIDC sub claim contains it"
        type: string
        required: true
      image-name:
        description: "Image name under ghcr.io/<owner>/ (same value given to reusable-build)"
        type: string
        required: true
      image-tag:
        description: "Tag to deploy: git SHA for debug, release tag for prod. Never rebuilt here"
        type: string
        required: true
      release-name:
        description: "Helm release name (defaults to image-name)"
        type: string
        default: ""
      chart-path:
        type: string
        default: "chart"
      values-file:
        description: "Environment values file, e.g. chart/values-debug.yaml"
        type: string
        required: true
      namespace:
        description: "Target namespace. The deploy role can only write here; it cannot create namespaces"
        type: string
        default: "apps"
      aws-region:
        type: string
        default: "us-east-2"
      timeout:
        description: "Helm wait timeout before rolling back"
        type: string
        default: "5m"

# Permissions come from the caller: contents: read, id-token: write.
jobs:
  deploy:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moves to 26.04 in Nov 2026
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false   # never interrupt a helm upgrade mid-flight
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      NAMESPACE: ${{ inputs.namespace }}
      RELEASE: ${{ inputs.release-name || inputs.image-name }}
    steps:
      - name: Check environment variables
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=0
          for v in AWS_ROLE_ARN EKS_CLUSTER_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Environment '${ENVIRONMENT}' has no variable ${v}"; missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Kubeconfig
        env:
          REGION: ${{ inputs.aws-region }}
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$REGION"

      - name: helm upgrade --install
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}
          TAG: ${{ inputs.image-tag }}
          CHART: ${{ inputs.chart-path }}
          VALUES: ${{ inputs.values-file }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/${NAME,,}"
          # Helm 4: --rollback-on-failure replaces v3's --atomic (and implies waiting).
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            -f "$VALUES" \
            --set image.repository="$repo" \
            --set image.tag="$TAG" \
            --rollback-on-failure --wait --timeout "$TIMEOUT"
          {
            echo "### Deployed"
            echo "- release \`$RELEASE\` in \`$NAMESPACE\` on \`$EKS_CLUSTER_NAME\`"
            echo "- image \`${repo}:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Status
        run: |
          helm status "$RELEASE" -n "$NAMESPACE"
          kubectl -n "$NAMESPACE" get deploy,pods,svc -l app.kubernetes.io/instance="$RELEASE"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app.kubernetes.io/instance="$RELEASE" | tail -60 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true
          helm history "$RELEASE" -n "$NAMESPACE" || true
