# Promote an already-built image: add a release tag to the image built for a commit.
# Registry-side only (manifest copy); nothing is rebuilt, so prod runs the exact bytes debug ran.
# Called from app repos as: sockstabby/platform/.github/workflows/reusable-promote.yml@v1
name: reusable-promote

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name under ghcr.io/<owner>/ (same value given to reusable-build)"
        type: string
        required: true
      source-tag:
        description: "Existing tag to promote (the git SHA built on main)"
        type: string
        required: true
      target-tag:
        description: "Tag to add (the release tag, e.g. v1.2.3)"
        type: string
        required: true
    outputs:
      image:
        description: "Promoted image reference (repository:target-tag)"
        value: ${{ jobs.promote.outputs.image }}

# Permissions come from the caller: contents: read, packages: write.
jobs:
  promote:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release tag to existing image
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}
          SRC: ${{ inputs.source-tag }}
          DST: ${{ inputs.target-tag }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/${NAME,,}"
          if ! docker buildx imagetools inspect "${repo}:${SRC}" >/dev/null 2>&1; then
            echo "::error::${repo}:${SRC} does not exist. Releases must point at a commit that was built on main (and therefore deployed to debug)."
            exit 1
          fi
          docker buildx imagetools create --tag "${repo}:${DST}" "${repo}:${SRC}"
          docker buildx imagetools inspect "${repo}:${DST}" | head -5
          echo "image=${repo}:${DST}" >> "$GITHUB_OUTPUT"
          echo "### Promoted \`${repo}:${SRC}\` → \`${DST}\` (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
